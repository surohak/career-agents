<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;width:1200px;height:420px;overflow:hidden;background:#f3f2ef}
.card{background:#fff;margin:16px;border-radius:10px;height:388px;position:relative;font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;overflow:hidden}
.banner{height:150px;background:linear-gradient(135deg,#0f172a,#1e293b)}
.ph{position:absolute;left:32px;top:80px;width:140px;height:140px;border-radius:50%;background:#dfe6ee;border:4px solid #fff;display:flex;align-items:center;justify-content:center;font-size:44px;color:#4a5b6c;overflow:hidden}
.ph img{width:100%;height:100%;object-fit:cover}
.body{padding:84px 32px 0}
.n{font-size:26px;font-weight:600}
.h{font-size:17px;margin-top:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;max-width:760px}
.l{font-size:14px;color:#666;margin-top:6px}
.c{font-size:14px;color:#0a66c2;margin-top:4px;font-weight:600}
.b{position:absolute;right:32px;top:170px;font-size:13px;color:#444;max-width:300px}
</style></head><body><div class="card">
<div class="banner"></div><div class="ph">{{PHOTO}}</div>
<div class="body"><div class="n">{{NAME}}</div><div class="h">{{HEADLINE}}</div><div class="l">{{LOCATION}}</div><div class="c">{{CONNECTIONS}}</div></div>
<div class="b">{{BADGES}}</div>
</div></body></html>
