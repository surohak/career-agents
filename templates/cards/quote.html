<!doctype html><html><head><meta charset="utf-8"><style>
:root{--bg1:#0f172a;--bg2:#1e293b;--fg:#f8fafc;--accent:#38bdf8;--muted:#94a3b8}
html,body{margin:0;width:1200px;height:1200px;overflow:hidden}
body{background:linear-gradient(135deg,var(--bg1),var(--bg2));color:var(--fg);font-family:-apple-system,"Segoe UI",Inter,Helvetica,Arial,sans-serif;display:flex;flex-direction:column;justify-content:center;padding:110px;box-sizing:border-box}
.mark{color:var(--accent);font-size:120px;line-height:0.6;margin-bottom:40px}
h1{font-size:68px;line-height:1.2;font-weight:700;margin:0}
.who{margin-top:70px;font-size:34px;color:var(--muted)}
.who b{color:var(--fg);font-weight:600}
</style></head><body>
<div class="mark">&ldquo;</div>
<h1>{{QUOTE}}</h1>
<div class="who"><b>{{NAME}}</b><br>{{SITE}}</div>
</body></html>
