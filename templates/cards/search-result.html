<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;width:800px;height:140px;overflow:hidden;background:#fff}
body{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;color:#000;display:flex;gap:16px;padding:18px 24px;box-sizing:border-box;border-bottom:1px solid #e0e0e0}
.ph{width:72px;height:72px;border-radius:50%;background:#dfe6ee;display:flex;align-items:center;justify-content:center;font-size:26px;color:#4a5b6c;flex:0 0 72px;overflow:hidden}
.ph img{width:100%;height:100%;object-fit:cover}
.n{font-size:17px;font-weight:600;color:#0a66c2}
.n span{color:#666;font-weight:400;font-size:13px;margin-left:6px}
.h{font-size:14px;color:#000;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:640px}
.l{font-size:13px;color:#666;margin-top:3px}
.a{font-size:13px;color:#444;margin-top:6px;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
</style></head><body>
<div class="ph">{{PHOTO}}</div>
<div><div class="n">{{NAME}}<span>· 2nd</span></div><div class="h">{{HEADLINE}}</div><div class="l">{{LOCATION}}</div><div class="a">{{ABOUT_2_LINES}}</div></div>
</body></html>
