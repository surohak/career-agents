<!doctype html><html><head><meta charset="utf-8"><style>
:root{--bg:#0b1220;--panel:#111a2e;--fg:#e2e8f0;--accent:#38bdf8;--muted:#94a3b8}
html,body{margin:0;width:1200px;height:1200px;overflow:hidden}
body{background:var(--bg);color:var(--fg);font-family:-apple-system,"Segoe UI",Inter,Helvetica,Arial,sans-serif;padding:90px;box-sizing:border-box}
h1{font-size:44px;margin:0 0 36px;font-weight:700}
h1 span{color:var(--accent)}
pre{background:var(--panel);border:2px solid #1e293b;border-radius:20px;padding:40px;font:30px/1.45 "SF Mono",Menlo,Consolas,monospace;white-space:pre;overflow:hidden;margin:0;height:820px;box-sizing:border-box}
.foot{margin-top:30px;font-size:28px;color:var(--muted)}
</style></head><body>
<h1>{{TITLE}} <span>{{FOCUS}}</span></h1>
<pre>{{CODE}}</pre>
<div class="foot">{{NAME}} &middot; {{SITE}}</div>
</body></html>
