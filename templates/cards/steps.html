<!doctype html><html><head><meta charset="utf-8"><style>
:root{--bg1:#0f172a;--bg2:#1e293b;--fg:#f8fafc;--accent:#38bdf8;--muted:#94a3b8}
html,body{margin:0;width:1200px;height:1200px;overflow:hidden}
body{background:linear-gradient(160deg,var(--bg1),var(--bg2));color:var(--fg);font-family:-apple-system,"Segoe UI",Inter,Helvetica,Arial,sans-serif;padding:100px;box-sizing:border-box}
h1{font-size:60px;margin:0 0 60px;line-height:1.15}
.step{display:flex;gap:36px;align-items:flex-start;margin-bottom:54px}
.n{flex:0 0 96px;height:96px;border-radius:50%;border:4px solid var(--accent);color:var(--accent);font-size:46px;font-weight:700;display:flex;align-items:center;justify-content:center}
.t{font-size:40px;line-height:1.3}
.t b{display:block;font-size:44px;margin-bottom:6px}
.foot{position:absolute;bottom:80px;left:100px;font-size:28px;color:var(--muted)}
</style></head><body>
<h1>{{TITLE}}</h1>
<div class="step"><div class="n">1</div><div class="t"><b>{{S1_TITLE}}</b>{{S1_TEXT}}</div></div>
<div class="step"><div class="n">2</div><div class="t"><b>{{S2_TITLE}}</b>{{S2_TEXT}}</div></div>
<div class="step"><div class="n">3</div><div class="t"><b>{{S3_TITLE}}</b>{{S3_TEXT}}</div></div>
<div class="foot">{{NAME}} &middot; {{SITE}}</div>
</body></html>
